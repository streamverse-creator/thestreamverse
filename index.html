<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STREAM⚡VERSE | Cinematic Intelligence</title>
  
  <!-- Fonts & Tailwind -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Netlify Identity Widget -->
  <script type="text/javascript" src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #05070f;
      color: #e2e8f0;
      overflow-y: auto;
    }
    .font-syne { font-family: 'Syne', sans-serif; }
    .font-newsreader { font-family: 'Newsreader', serif; }
  </style>
</head>
<body class="min-h-screen pb-16">

  <!-- Header -->
  <header class="max-w-7xl mx-auto px-6 py-6 flex justify-between items-center border-b border-slate-800/60">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 bg-cyan-500 rounded-lg flex items-center justify-center font-bold text-black text-xl shadow-lg shadow-cyan-500/20">⚡</div>
      <div>
        <h1 class="font-syne text-2xl tracking-wider text-white">STREAM<span class="text-cyan-400">⚡</span>VERSE</h1>
        <p class="text-xs text-slate-400 tracking-widest uppercase">Cinematic Intelligence</p>
      </div>
    </div>
    <a href="/admin/" class="px-4 py-2 text-xs font-semibold rounded-full border border-slate-700 hover:border-cyan-400 text-slate-300 hover:text-white transition">
      ⌘ Admin Studio Login
    </a>
  </header>

  <!-- Dynamic Hero Showcase Banner -->
  <section id="hero-banner" class="max-w-7xl mx-auto px-6 mt-8">
    <div class="rounded-3xl p-8 border border-slate-800 bg-slate-900/40 text-center text-slate-500">
      Loading latest featured spotlight...
    </div>
  </section>

  <!-- Main Content Grid -->
  <main class="max-w-7xl mx-auto px-6 mt-16">
    <div class="flex flex-col md:flex-row items-start md:items-center justify-between gap-4 mb-8">
      <div>
        <h2 class="font-syne text-3xl text-white">Reviews</h2>
        <p class="text-slate-400 text-sm mt-1">Latest critiques across film, TV, and digital media</p>
      </div>
      <!-- Category Filters -->
      <div class="flex flex-wrap gap-2">
        <button onclick="filterReviews('all')" class="px-4 py-2 bg-cyan-500 text-black font-semibold text-xs rounded-full transition">All</button>
        <button onclick="filterReviews('Films')" class="px-4 py-2 bg-slate-900 border border-slate-800 hover:border-cyan-500 text-slate-300 text-xs font-semibold rounded-full transition">Films</button>
        <button onclick="filterReviews('Series')" class="px-4 py-2 bg-slate-900 border border-slate-800 hover:border-cyan-500 text-slate-300 text-xs font-semibold rounded-full transition">Series</button>
        <button onclick="filterReviews('Documentaries')" class="px-4 py-2 bg-slate-900 border border-slate-800 hover:border-cyan-500 text-slate-300 text-xs font-semibold rounded-full transition">Documentaries</button>
        <button onclick="filterReviews('Videos')" class="px-4 py-2 bg-slate-900 border border-slate-800 hover:border-cyan-500 text-slate-300 text-xs font-semibold rounded-full transition">Videos</button>
      </div>
    </div>

    <!-- Dynamic Reviews Grid -->
    <div id="reviews-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <div class="col-span-full text-center py-12 text-slate-500">Loading reviews...</div>
    </div>
  </main>

  <!-- Full Review Reader Modal -->
  <div id="review-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-3xl max-w-3xl w-full max-h-[90vh] overflow-y-auto p-8 relative shadow-2xl">
      <button onclick="closeModal()" class="absolute top-6 right-6 w-10 h-10 bg-slate-800 hover:bg-cyan-500 hover:text-black text-white rounded-full flex items-center justify-center font-bold transition">✕</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <script>
    let allReviewsData = [];

    async function loadReviews() {
      const heroSection = document.getElementById('hero-banner');
      const grid = document.getElementById('reviews-grid');
      
      try {
        const response = await fetch('https://api.github.com/repos/streamverse-creator/thestreamverse/contents/content/reviews');
        if (!response.ok) throw new Error('No published reviews found yet.');

        const files = await response.json();
        const mdFiles = files.filter(file => file.name.endsWith('.md'));

        if (mdFiles.length === 0) {
          heroSection.innerHTML = '';
          grid.innerHTML = '<div class="col-span-full text-center py-12 text-slate-500">No reviews published yet.</div>';
          return;
        }

        allReviewsData = [];

        for (const file of mdFiles) {
          const contentRes = await fetch(file.download_url);
          const rawText = await contentRes.text();

          const parts = rawText.split('---');
          let frontmatter = {};
          let bodyContent = '';

          if (parts.length >= 3) {
            parts[1].split('\n').forEach(line => {
              const colonIndex = line.indexOf(':');
              if (colonIndex !== -1) {
                const key = line.slice(0, colonIndex).trim();
                const value = line.slice(colonIndex + 1).trim().replace(/^['"]|['"]$/g, '');
                frontmatter[key] = value;
              }
            });
            bodyContent = parts.slice(2).join('---').trim();
          } else {
            bodyContent = rawText;
          }

          allReviewsData.push({
            title: frontmatter.title || 'Untitled',
            category: frontmatter.category || 'Review',
            subtitle: frontmatter.subtitle || '',
            summary: frontmatter.summary || '',
            image: frontmatter.image || frontmatter.poster || frontmatter.cover || '',
            date: frontmatter.date || new Date().toISOString(),
            body: bodyContent
          });
        }

        // Sort newest first
        allReviewsData.sort((a, b) => new Date(b.date) - new Date(a.date));

        // Render Hero Banner using index reference (index 0 is newest)
        if (allReviewsData.length > 0) {
          const latest = allReviewsData[0];
          heroSection.innerHTML = `
            <div class="relative rounded-3xl overflow-hidden border border-slate-800 bg-slate-900/40 shadow-2xl flex flex-col lg:flex-row items-center">
              <div class="w-full lg:w-1/2 p-8 lg:p-12 z-10">
                <div class="flex items-center gap-2 mb-4">
                  <span class="px-3 py-1 bg-cyan-500/10 border border-cyan-500/30 text-cyan-400 text-xs font-semibold uppercase tracking-wider rounded-full">Featured Spotlight</span>
                  <span class="text-amber-400 text-xs font-bold">★ Latest Release</span>
                </div>
                <h2 class="font-syne text-4xl lg:text-5xl text-white font-bold leading-tight">${latest.title}</h2>
                ${latest.subtitle ? `<p class="font-newsreader italic text-slate-300 text-lg mt-2">${latest.subtitle}</p>` : ''}
                ${latest.summary ? `<p class="text-slate-400 text-sm mt-4 leading-relaxed line-clamp-3">${latest.summary}</p>` : ''}
                <div class="mt-8">
                  <button onclick="openReviewByIndex(0)" class="inline-flex items-center gap-2 px-6 py-3 bg-cyan-500 hover:bg-cyan-400 text-black font-semibold text-sm rounded-full transition shadow-lg shadow-cyan-500/20 cursor-pointer">
                    Read Full Review →
                  </button>
                </div>
              </div>
              <div class="w-full lg:w-1/2 h-72 lg:h-[420px] relative cursor-pointer" onclick="openReviewByIndex(0)">
                ${latest.image ? `<img src="${latest.image}" alt="${latest.title}" class="w-full h-full object-cover">` : '<div class="w-full h-full bg-slate-800 flex items-center justify-center text-slate-600">NO IMAGE</div>'}
                <div class="absolute inset-0 bg-gradient-to-r from-[#05070f] via-transparent to-transparent lg:block hidden"></div>
              </div>
            </div>
          `;
        }

        renderGrid(allReviewsData);
      } catch (err) {
        console.error(err);
        grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-500">${err.message}</div>`;
      }
    }

    function renderGrid(reviews) {
      const grid = document.getElementById('reviews-grid');
      if (reviews.length === 0) {
        grid.innerHTML = '<div class="col-span-full text-center py-12 text-slate-500">No reviews found in this category.</div>';
        return;
      }

      grid.innerHTML = '';
      reviews.forEach((review) => {
        // Find its true index in the master array so modal opens correctly even when filtered
        const originalIndex = allReviewsData.findIndex(r => r.title === review.title);

        const card = document.createElement('article');
        card.className = "bg-slate-900/60 border border-slate-800 rounded-2xl overflow-hidden hover:border-cyan-500/50 transition flex flex-col justify-between shadow-xl cursor-pointer";
        card.onclick = () => openReviewByIndex(originalIndex);
        
        card.innerHTML = `
          <div>
            ${review.image ? `<img src="${review.image}" alt="${review.title}" class="w-full h-52 object-cover">` : '<div class="w-full h-52 bg-slate-800 flex items-center justify-center text-slate-600 font-syne text-sm">NO IMAGE PROVIDED</div>'}
            <div class="p-6">
              <span class="text-xs font-semibold text-cyan-400 uppercase tracking-wider">${review.category}</span>
              <h3 class="font-syne text-xl text-white mt-2">${review.title}</h3>
              ${review.subtitle ? `<p class="font-newsreader italic text-slate-300 text-sm mt-1">${review.subtitle}</p>` : ''}
              ${review.summary ? `<p class="text-slate-400 text-xs mt-3 line-clamp-3">${review.summary}</p>` : ''}
            </div>
          </div>
          <div class="px-6 pb-6 pt-2 border-t border-slate-800/40 flex justify-between items-center text-xs text-slate-500">
            <span>Published: ${review.date.slice(0, 10)}</span>
            <span class="text-cyan-400 font-medium hover:underline">Read Review →</span>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function openReviewByIndex(index) {
      const review = allReviewsData[index];
      if (!review) return;

      const modal = document.getElementById('review-modal');
      const content = document.getElementById('modal-content');
      
      content.innerHTML = `
        <span class="text-xs font-semibold text-cyan-400 uppercase tracking-wider">${review.category}</span>
        <h2 class="font-syne text-3xl text-white font-bold mt-2">${review.title}</h2>
        ${review.subtitle ? `<p class="font-newsreader italic text-slate-300 text-base mt-1">${review.subtitle}</p>` : ''}
        <span class="text-xs text-slate-500 block mt-2 mb-6">Published: ${review.date.slice(0, 10)}</span>
        
        ${review.image ? `<img src="${review.image}" alt="${review.title}" class="w-full h-72 object-cover rounded-2xl mb-6 border border-slate-800">` : ''}
        
        <div class="text-slate-300 text-sm leading-relaxed whitespace-pre-wrap font-sans space-y-4">
          ${review.body || review.summary || 'No full review text provided.'}
        </div>
      `;
      modal.classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('review-modal').classList.add('hidden');
    }

    function filterReviews(category) {
      document.querySelectorAll('button[onclick^="filterReviews"]').forEach(btn => {
        if(btn.textContent.trim().toLowerCase() === category.toLowerCase() || (category === 'all' && btn.textContent.trim() === 'All')) {
          btn.className = "px-4 py-2 bg-cyan-500 text-black font-semibold text-xs rounded-full transition";
        } else {
          btn.className = "px-4 py-2 bg-slate-900 border border-slate-800 hover:border-cyan-500 text-slate-300 text-xs font-semibold rounded-full transition";
        }
      });

      if (category === 'all') {
        renderGrid(allReviewsData);
      } else {
        const filtered = allReviewsData.filter(r => r.category.toLowerCase() === category.toLowerCase());
        renderGrid(filtered);
      }
    }

    loadReviews();
  </script>
</body>
</html>
